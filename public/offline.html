<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMS - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 72px; }
    h1 { font-size: 24px; font-weight: 700; color: #f97316; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.6; max-width: 300px; }
    .badge {
      background: rgba(249,115,22,0.15);
      border: 1px solid rgba(249,115,22,0.3);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 13px;
      color: #f97316;
    }
    button {
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="icon">📴</div>
  <div class="badge">Offline Mode</div>
  <h1>Internet नहीं है</h1>
  <p>App use karte raho — data locally save hoga. Internet aate hi automatic sync ho jaayega.</p>
  <button onclick="window.location.reload()">🔄 Retry</button>

  <script>
    // Auto-redirect when online
    window.addEventListener('online', function() {
      window.location.href = '/';
    });
  </script>
</body>
</html>
